name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: PHP ${{ matrix.php }} / PHPUnit ${{ matrix.phpunit }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "7.2"
            phpunit: "^8.5"
          - php: "7.3"
            phpunit: "^8.5"
          - php: "7.4"
            phpunit: "^9.6"
          - php: "8.0"
            phpunit: "^9.6"
          - php: "8.1"
            phpunit: "^10.5"
          - php: "8.2"
            phpunit: "^10.5"
          - php: "8.3"
            phpunit: "^11.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - name: Require specific PHPUnit version
        run: composer require --dev "phpunit/phpunit:${{ matrix.phpunit }}" --no-update

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --testdox
